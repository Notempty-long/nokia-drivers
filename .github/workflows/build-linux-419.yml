name: Build Nokia 2.3 drivers against vendor kernel

on:
  push:
    branches:
      - main
      - fix/makefile-skip-audio-wifi
  pull_request:

jobs:
  build-nokia-vendor-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabihf-

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install cross toolchain and build deps
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            gcc-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf

      - name: Download Nokia 2.3 vendor kernel source
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/nokia-kernel"
          cd "$RUNNER_TEMP/nokia-kernel"
          curl -L --retry 3 --retry-delay 5 \
            -o Nokia2.3_V3.311.tar.bz2 \
            https://nokiaphones-opensource.azureedge.net/download/phones/Nokia2.3_V3.311.tar.bz2
          tar -xjf Nokia2.3_V3.311.tar.bz2

      - name: Locate extracted kernel tree
        shell: bash
        id: kernel
        run: |
          set -e
          KDIR="$(find "$RUNNER_TEMP/nokia-kernel" -type f -name Makefile -print -quit | xargs -r dirname)"
          if [ -z "$KDIR" ] || [ ! -f "$KDIR/Makefile" ]; then
            echo "Kernel Makefile not found under $RUNNER_TEMP/nokia-kernel" >&2
            exit 1
          fi
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"

      - name: Configure the vendor kernel tree
        shell: bash
        run: |
          set -e
          cd "$KDIR"
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- k61v1_64_bsp_defconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- prepare modules_prepare -j"$(nproc)"

      - name: Build vendored drivers against the vendor tree
        shell: bash
        run: |
          set -e
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- KDIR="$KDIR" all

      - name: Clean build outputs
        shell: bash
        run: |
          set -e
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- KDIR="$KDIR" clean
